openapi: 3.0.3
info: { title: Quirks, version: 1.0.0 }
paths:
  /things:
    get:
      operationId: listThings
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thing' }
components:
  schemas:
    Thing:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
        score:
          type: number
          minimum: 0
          exclusiveMinimum: true
        tags:
          type: array
          nullable: true
          items: { type: string }
