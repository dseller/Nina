name: ci

on:
  push:
    branches: [master]

concurrency:
  group: master-build
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # metadata-action lowercases this, which matters because the repo name is
  # mixed case and GHCR only accepts lowercase paths.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      # Linux has the C toolchain the race detector needs, which the Windows
      # dev box does not; this is the job that actually exercises reload
      # concurrency.
      - name: test (race)
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: validate the example config
        run: |
          go build -o bin/nina ./cmd/nina
          ./bin/nina check -c examples/nina.yaml
          ./bin/nina spec build -c examples/nina.yaml -o /dev/null

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/nina

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # write, because this job mints the release tag.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The version bump reads the existing tags, which the default
          # shallow fetch does not have.
          fetch-depth: 0

      # Every master build gets the next minor. The tag itself is only
      # pushed at the end, once the image is built, smoke tested and
      # published, so a failed run does not burn a version number.
      - name: Next version
        id: version
        run: |
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            ver=${latest#v}
            major=${ver%%.*}
            rest=${ver#*.}
            minor=${rest%%.*}
            next="v${major}.$((minor + 1)).0"
          fi
          echo "Previous: ${latest:-none}; building $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Single-arch build first so the image can be loaded into the local
      # daemon and actually exercised. The multi-arch build below reuses every
      # layer from the cache, so this costs little.
      - name: Build (amd64, for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nina:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm nina:ci --version
          # Same gate the Go CI runs, but against the packaged binary and the
          # image's CA bundle. `check` reads the local spec files and never
          # contacts the example backends.
          docker run --rm -v "$PWD/examples:/etc/nina:ro" nina:ci \
            check -c /etc/nina/nina.yaml

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "${{ steps.version.outputs.version }}" \
              -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
